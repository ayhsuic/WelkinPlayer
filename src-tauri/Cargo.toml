[package]
name = "welkinplayer"
version = "1.3.0-alt.1"
description = "A Tauri App"
authors = ["Atemukesu"]
license = "GPL-3.0-only"
repository = "https://github.com/atemukesu/WelkinPlayer"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "welkinplayer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "3.0.0-alpha.4", features = [] }

[dependencies]
# The webview runtime: Tauri 3 depends on a runtime crate directly and picks it
# at startup. The Android build uses wry's mobile backend.
tauri = { version = "3.0.0-alpha.5", features = ["protocol-asset", "image-png"] }
tauri-plugin-opener = "3.0.0-alpha.3"
tauri-plugin-store = "3.0.0-alpha.3"
tauri-runtime-wry = { version = "3.0.0-alpha.5" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
# WebDAV client. rustls avoids a system TLS/OpenSSL dependency on every OS.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking", "json"] }
quick-xml = "0.37"
percent-encoding = "2"
# Bounded concurrency for the recursive PROPFIND library walk.
futures-util = "0.3"
# Zeroes the stored WebDAV password when the client is dropped.
zeroize = "1"
# Audio metadata parsing reads only the file head (HTTP Range), never the whole file.
lofty = "0.22"
# Decode embedded cover art and re-encode a small JPEG thumbnail for the cache.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp", "tiff"] }
base64 = "0.22"
urlencoding = "2"
# Content-addressed naming for standalone playlist cover files.
sha2 = "0.10"
# Enumerate installed font families for the lyrics font picker (loads the
# platform font directories and parses each font's name table).
fontdb = "0.24.0"
# SemVer comparison for update checks and the cumulative changelog range.
semver = "1"
# Smart transitions reuse an existing pure-DSP implementation instead of
# hand-writing BPM/key/loudness analysis and crossfade-point selection. It has
# no C/FFmpeg dependency (only `thiserror`) and uses Rust 2024.
automix = "2.0.1"
# Exact Held-Karp TSP solver used to order a playlist for the smoothest chain of
# transitions. Exact up to 20 nodes, which covers ordinary playlists.
held-karp-core = "0.1.1"

# Audio decoding/rendering: `cpal` drives Oboe (AAudio / OpenSL ES) on Android,
# so there is no hand-written JNI. `symphonia-all` covers mp3/flac/vorbis/wav/
# aac/mp4; `symphonia-alac` adds ALAC. `cpal-shared-stdcxx` links the NDK's
# shared libc++ that the Tauri Android app already ships.
# rodio 0.21 owns the decode path again: `Decoder::builder().with_byte_len(len)`
# reports the real stream length to Symphonia, which is what its demuxers need to
# seek. The `flac`/`mp3`/`mp4`/`vorbis`/`wav` meta-features pull the matching
# Symphonia demuxer+codec pairs; `symphonia-alac` adds ALAC. `playback` enables
# the cpal output stream.
rodio = { version = "0.21", default-features = false, features = ["playback", "flac", "mp3", "mp4", "vorbis", "wav", "symphonia-alac", "symphonia-adpcm", "cpal-shared-stdcxx"] }
# Pitch-preserving playback-speed changes (WSOLA time-stretch). Pure Rust, so
# it cross-compiles to Android with no extra C/C++ toolchain.
wsola = "0.2"
rustfft = "6"
# Lock-free single-producer/single-consumer audio transport. The producer
# stays on the decode worker and the consumer is owned by RingSource.
rtrb = "0.3"

# Android has no keyring backend of its own. `android-keyring` installs a
# Keystore-backed credential builder over the plain `keyring` crate, and `jni`
# backs this crate's own bridge calls. `ndk-context` is deliberately absent:
# tao publishes that slot itself (from `Rust.onCreate`) and publishing it twice
# aborts, so `src/platform/android.rs` caches the handles it needs instead.
[target.'cfg(target_os = "android")'.dependencies]
keyring = "3"
android-keyring = { version = "0.2", default-features = false }
jni = "0.21"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# The WSOLA time-stretcher runs a per-sample similarity search (~hundreds of
# millions of multiply-adds per second) on the decode worker. At the dev
# profile's `opt-level = 0` it cannot keep up with realtime playback, so build
# just this dependency optimized even in `cargo run` / `tauri dev`.
[profile.dev.package.wsola]
opt-level = 3

# The smart-transition analyser is the same story: `automix` runs the onset /
# Goertzel / MFCC loops over two 60-second buffers per track. Unoptimised it
# takes tens of seconds per track, which looks like a hang. Optimise it (and
# only it) in the dev profile so analysis stays interactive.
[profile.dev.package.automix]
opt-level = 3
