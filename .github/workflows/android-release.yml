name: Android Release

# Tag-triggered Android-only release. No desktop bundles are built here.
#
# Pushing a `v*` tag (or running this manually) builds a stripped release APK
# for arm64-v8a and uploads it to that tag's GitHub Release. The release
# profile (`src-tauri/Cargo.toml`: lto + strip + opt-level 3) keeps the native
# library small; this deliberately does NOT pass `--debug`, which ships an
# unstripped debug library and balloons the APK to hundreds of MB.
#
# Signing secrets are optional. When `ANDROID_KEYSTORE_BASE64` is set the four
# Android signing env vars are injected; when absent the build falls back to the
# debug signing key (see README "构建" note). Required secrets:
#   ANDROID_KEYSTORE_BASE64   base64 of the release keystore file
#   ANDROID_KEYSTORE_PASSWORD keystore password
#   ANDROID_KEY_ALIAS         key alias
#   ANDROID_KEY_PASSWORD      key password
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
          # Multi-ABI split builds additionally need:
          #   armv7-linux-androideabi, i686-linux-android, x86_64-linux-android

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: Use the preinstalled Android SDK
        run: |
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          sdkmanager=$(find "$sdk/cmdline-tools" -maxdepth 3 -type f -name sdkmanager 2>/dev/null | sort | tail -n1)
          if [ -n "$sdkmanager" ]; then
            yes | "$sdkmanager" --licenses >/dev/null 2>&1 || true
          fi
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b
          add-to-path: false

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync version from package.json
        run: pnpm version:sync

      - name: Decode Android signing keystore (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/welkin.keystore"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/welkin.keystore" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "Signing: using the configured release keystore."
          else
            echo "Signing: no release keystore secret set, falling back to the debug signing key."
          fi

      # automix 2.0.1 unconditionally links the system librubberband (its Deck
      # time-stretch FFI), which the NDK does not ship. This app only uses
      # automix's pure-DSP analyser on Android, so compile an empty stub archive
      # that satisfies the FFI symbols and add it to the native link search path.
      # See src-tauri/android-stub/rubberband-stub.c.
      - name: Stub librubberband for Android NDK
        env:
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          stub_dir="$RUNNER_TEMP/rubberband-stub"
          mkdir -p "$stub_dir"
          prebuilt="$(ls -d "$NDK_HOME"/toolchains/llvm/prebuilt/* | head -n1)"
          "$prebuilt/bin/aarch64-linux-android26-clang" \
            -c src-tauri/android-stub/rubberband-stub.c \
            -o "$stub_dir/stub.o"
          "$prebuilt/bin/llvm-ar" cru "$stub_dir/librubberband.a" "$stub_dir/stub.o"
          "$prebuilt/bin/llvm-ar" t "$stub_dir/librubberband.a"
          echo "RUSTFLAGS=${RUSTFLAGS:-} -L native=$stub_dir" >> "$GITHUB_ENV"

      - name: Build release arm64-v8a APK
        env:
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: pnpm tauri android build --apk --target aarch64 --ci
        # Multi-ABI split build (disabled): build one APK per ABI instead of a
        # single arm64-v8a package, then use the per-ABI staging block below.
        #   pnpm tauri android build --apk --split-per-abi --ci

      - name: Stage APK
        run: |
          mkdir -p dist/android
          apk=$(find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" | head -n1)
          if [ -z "$apk" ]; then
            echo "No APK was produced under src-tauri/gen/android/app/build/outputs/apk" >&2
            exit 1
          fi
          codename=$(node -e "console.log(JSON.parse(require('fs').readFileSync('package.json','utf8')).codename || '')")
          [ -n "$codename" ] || codename="${GITHUB_REF_NAME}"
          echo "CODENAME=$codename" >> "$GITHUB_ENV"
          cp "$apk" "dist/android/Welkin-${codename}-arm64-v8a.apk"
          ls -l dist/android

          # --- Multi-ABI staging (disabled) ---------------------------------
          # Stage every split APK under a per-ABI name instead of the single
          # arm64-v8a copy above:
          #   abi_for() { case "$1" in
          #     *arm64-v8a*|*arm64*|*aarch64*) echo arm64-v8a ;;
          #     *armeabi-v7a*|*armeabi*|*armv7*|*arm*) echo armeabi-v7a ;;
          #     *x86_64*) echo x86_64 ;;
          #     *x86*) echo x86 ;;
          #     *) echo universal ;;
          #   esac }
          #   rm -f dist/android/*.apk
          #   for apk in $(find src-tauri/gen/android/app/build/outputs/apk -name "*.apk"); do
          #     abi=$(abi_for "$apk")
          #     cp "$apk" "dist/android/Welkin-${codename}-${abi}.apk"
          #   done
          # ---------------------------------------------------------------------

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-arm64-v8a
          path: dist/android
          if-no-files-found: error

      - name: Publish APK to the tag Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Compose the release notes inline: a per-APK download guide grouped by
          # ABI. The loop already covers a future multi-ABI split build; only the
          # build/stage blocks above are disabled for now.
          {
            echo "## 下载指引"
            echo
            echo "请根据你的设备选择对应 APK。"
            echo
            echo "| 平台 | 文件 | 说明 |"
            echo "| --- | --- | --- |"
            for apk in dist/android/*.apk; do
              [ -e "$apk" ] || continue
              name=$(basename "$apk")
              case "$name" in
                *arm64-v8a*|*arm64*|*aarch64*) hint="绝大多数现代 64 位手机与平板" ;;
                *armeabi-v7a*|*armeabi*|*armv7*|*arm*) hint="较旧的 32 位设备" ;;
                *x86_64*) hint="模拟器或少数 x86_64 设备" ;;
                *x86*) hint="模拟器或少数 x86 设备" ;;
                *) hint="通用包，兼容多数设备但体积更大" ;;
              esac
              echo "| Android | \`${name}\` | ${hint} |"
            done
          } > release-notes.md

          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/android/*.apk --clobber
          else
            [ -s changelog.md ] || printf 'Welkin %s\n' "${CODENAME}" > changelog.md
            gh release create "${GITHUB_REF_NAME}" dist/android/*.apk \
              --title "Welkin ${CODENAME}" --notes-file release-notes.md
          fi
