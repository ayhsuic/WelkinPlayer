name: Android Build (fix verification)

# Android compile smoke test.
#
# Manual-only compile smoke test. Builds a debug arm64-v8a APK so NO signing
# secrets are required; uploads the APK as an artifact for inspection. This
# proves the Rust code compiles and bundles for the same ABI shipped by the
# release workflow. Tag-triggered release APKs live in `android-release.yml`;
# this workflow no longer runs on every branch push.
on:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
          # Multi-ABI split builds additionally need:
          #   armv7-linux-androideabi, i686-linux-android, x86_64-linux-android

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: Use the preinstalled Android SDK
        run: |
          # android-actions/setup-android@v3 tries to install the removed legacy
          # `tools` package and fails on current SDKs. The GitHub runner already
          # ships an SDK, so just accept its licenses and export the paths.
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          sdkmanager=$(find "$sdk/cmdline-tools" -maxdepth 3 -type f -name sdkmanager 2>/dev/null | sort | tail -n1)
          if [ -n "$sdkmanager" ]; then
            yes | "$sdkmanager" --licenses >/dev/null 2>&1 || true
          fi
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b
          add-to-path: false

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync version from package.json
        run: pnpm version:sync

      # automix 2.0.1 links the system librubberband FFI; the NDK does not ship
      # it. Compile the empty stub archive (aarch64 only) and add it to the
      # native link path. See src-tauri/android-stub/rubberband-stub.c.
      - name: Stub librubberband for Android NDK
        env:
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          stub_dir="$RUNNER_TEMP/rubberband-stub"
          mkdir -p "$stub_dir"
          prebuilt="$(ls -d "$NDK_HOME"/toolchains/llvm/prebuilt/* | head -n1)"
          "$prebuilt/bin/aarch64-linux-android26-clang" \
            -c src-tauri/android-stub/rubberband-stub.c \
            -o "$stub_dir/stub.o"
          "$prebuilt/bin/llvm-ar" cru "$stub_dir/librubberband.a" "$stub_dir/stub.o"
          echo "RUSTFLAGS=${RUSTFLAGS:-} -L native=$stub_dir" >> "$GITHUB_ENV"

      - name: Build debug arm64-v8a APK
        env:
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: pnpm tauri android build --debug --apk --target aarch64
        # Multi-ABI split build (disabled): build one APK per ABI instead of a
        # single arm64-v8a package. The rubberband stub below is compiled for
        # aarch64 only, so the other splits fail at link time (#98).
        #   pnpm tauri android build --debug --apk --split-per-abi

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-debug
          path: src-tauri/gen/android/app/build/outputs/apk
          if-no-files-found: error
